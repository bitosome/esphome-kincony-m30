substitutions:
  device_name: kincony-m30
  device_friendly_name: KinCony M30
  device_model: M30
  device_make: KinCony
  package_version: "1.0.0"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ota_password: !secret ota_password
  ap_password: !secret ap_password
  led_indicator_brightness_percent: "10"
  idle_current_threshold_amps: "0.0"
  low_current_max_amps: "4.0"
  mid_current_max_amps: "8.0"
  high_current_max_amps: "12.0"
  alert_current_threshold: "16.0"

esphome:
  name: "${device_name}"
  friendly_name: "${device_friendly_name}"
  comment: "${device_model} by ${device_make} version ${package_version}"
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            lambda: 'return id(seed_led_profiles_on_boot);'
          then:
            - script.execute: seed_led_profiles
      - script.execute: refresh_ct_led_indicators

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  baud_rate: 0

api:

ota:
  - platform: esphome
    password: ${ota_password}
    on_begin:
      then:
        - lambda: 'id(seed_led_profiles_on_boot) = true;'

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "KinCony M30 Fallback"
    password: ${ap_password}

captive_portal:

globals:
  - id: seed_led_profiles_on_boot
    type: bool
    restore_value: true
    initial_value: "true"

switch:
  - platform: template
    name: "CT LED Indication"
    id: ct_led_indication_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    turn_on_action:
      - script.execute: refresh_ct_led_indicators
    turn_off_action:
      - light.turn_off: ct_led_strip

button:
  - platform: restart
    name: "Reboot device"
    id: button_restart
    icon: mdi:power-cycle
    entity_category: diagnostic

script:
  - id: seed_led_profiles
    mode: restart
    then:
      - lambda: |-
          const float brightness = ${led_indicator_brightness_percent} / 100.0f;

          auto seed_profile = [&](esphome::light::LightState *profile, float red, float green, float blue) {
            auto call = profile->turn_on();
            call.set_brightness(brightness);
            call.set_rgb(red, green, blue);
            call.perform();
          };

          seed_profile(id(low_current_led_profile), 0.0f, 1.0f, 0.0f);
          seed_profile(id(mid_current_led_profile), 1.0f, 1.0f, 0.0f);
          seed_profile(id(high_current_led_profile), 1.0f, 0.65f, 0.0f);
          seed_profile(id(alert_current_led_profile), 1.0f, 0.0f, 0.0f);
          id(seed_led_profiles_on_boot) = false;

  - id: refresh_ct_led_indicators
    mode: restart
    then:
      - lambda: |-
          const bool blink_on = ((millis() / 500) % 2) == 0;

          if (!id(ct_led_indication_enabled).state) {
            return;
          }

          auto apply_profile = [&](esphome::light::LightState *indicator, float current) {
            if (isnan(current) || current <= ${idle_current_threshold_amps}) {
              auto off_call = indicator->turn_off();
              off_call.perform();
              return;
            }

            esphome::light::LightState *profile = id(alert_current_led_profile);
            bool blink = false;
            if (current <= ${low_current_max_amps}) {
              profile = id(low_current_led_profile);
            } else if (current <= ${mid_current_max_amps}) {
              profile = id(mid_current_led_profile);
            } else if (current <= ${high_current_max_amps}) {
              profile = id(high_current_led_profile);
            } else if (current > ${alert_current_threshold}) {
              blink = true;
            }

            if (!profile->remote_values.is_on() || profile->remote_values.get_brightness() <= 0.0f) {
              auto off_call = indicator->turn_off();
              off_call.perform();
              return;
            }

            if (blink && !blink_on) {
              auto off_call = indicator->turn_off();
              off_call.perform();
              return;
            }

            auto call = indicator->turn_on();
            call.set_brightness(profile->remote_values.get_brightness());
            call.set_rgb(
              profile->remote_values.get_red(),
              profile->remote_values.get_green(),
              profile->remote_values.get_blue()
            );
            call.set_color_mode(ColorMode::RGB);
            call.perform();
          };

          apply_profile(id(ct_01_led), id(ct_01_current).state);
          apply_profile(id(ct_02_led), id(ct_02_current).state);
          apply_profile(id(ct_03_led), id(ct_03_current).state);
          apply_profile(id(ct_04_led), id(ct_04_current).state);
          apply_profile(id(ct_05_led), id(ct_05_current).state);
          apply_profile(id(ct_06_led), id(ct_06_current).state);
          apply_profile(id(ct_07_led), id(ct_07_current).state);
          apply_profile(id(ct_08_led), id(ct_08_current).state);
          apply_profile(id(ct_09_led), id(ct_09_current).state);
          apply_profile(id(ct_10_led), id(ct_10_current).state);
          apply_profile(id(ct_11_led), id(ct_11_current).state);
          apply_profile(id(ct_12_led), id(ct_12_current).state);
          apply_profile(id(ct_13_led), id(ct_13_current).state);
          apply_profile(id(ct_14_led), id(ct_14_current).state);
          apply_profile(id(ct_15_led), id(ct_15_current).state);
          apply_profile(id(ct_16_led), id(ct_16_current).state);
          apply_profile(id(ct_17_led), id(ct_17_current).state);
          apply_profile(id(ct_18_led), id(ct_18_current).state);
          apply_profile(id(ct_19_led), id(ct_19_current).state);
          apply_profile(id(ct_20_led), id(ct_20_current).state);
          apply_profile(id(ct_21_led), id(ct_21_current).state);
          apply_profile(id(ct_22_led), id(ct_22_current).state);
          apply_profile(id(ct_23_led), id(ct_23_current).state);
          apply_profile(id(ct_24_led), id(ct_24_current).state);
          apply_profile(id(ct_25_led), id(ct_25_current).state);
          apply_profile(id(ct_26_led), id(ct_26_current).state);
          apply_profile(id(ct_27_led), id(ct_27_current).state);
          apply_profile(id(ct_28_led), id(ct_28_current).state);
          apply_profile(id(ct_29_led), id(ct_29_current).state);
          apply_profile(id(ct_30_led), id(ct_30_current).state);

interval:
  - interval: 500ms
    then:
      - script.execute: refresh_ct_led_indicators

uart:
  id: modbus_uart
  rx_pin: 32
  tx_pin: 33
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE


modbus:
  id: modbus_hub
  uart_id: modbus_uart


