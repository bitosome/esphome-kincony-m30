light:
  - platform: partition
    name: "Low Current LED Profile"
    id: low_current_led_profile
    icon: mdi:palette
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      state: true
      brightness: ${led_indicator_brightness_percent}%
      red: 0%
      green: 100%
      blue: 0%
    on_state:
      then:
        - script.execute: refresh_ct_led_indicators
    segments:
      - id: ct_led_strip
        from: 0
        to: 0

